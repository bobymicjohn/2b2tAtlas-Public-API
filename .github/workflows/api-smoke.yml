name: Public API smoke test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-api-smoke
  cancel-in-progress: true

jobs:
  public-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check documented public reads
        run: bash scripts/smoke-test.sh

  examples:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run C# example
        run: dotnet run --project examples/csharp -- "Mu Megabase"
      - name: Run JavaScript example
        run: node examples/javascript/atlas-examples.mjs "Mu Megabase"
      - name: Run Python example
        run: python examples/python/atlas_examples.py "Mu Megabase"
