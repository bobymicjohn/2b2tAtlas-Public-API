name: Examples and contract checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: examples-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run every example against the fixture
        env:
          ATLAS_API_BASE_URL: http://127.0.0.1:8765
        run: |
          python tests/mock_atlas_api.py &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8765/api >/dev/null; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:8765/api >/dev/null
          dotnet run --project examples/csharp -- "Mu Megabase"
          node examples/javascript/atlas-examples.mjs "Mu Megabase"
          python examples/python/atlas_examples.py "Mu Megabase"
          bash scripts/smoke-test.sh
