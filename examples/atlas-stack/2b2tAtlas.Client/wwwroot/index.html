    <script data-cfasync="false">
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations()
                .then(registrations => Promise.all(registrations.map(registration => registration.unregister())));
        }
        if ('caches' in window) {
            caches.keys()
                .then(keys => Promise.all(keys
                    .filter(key => key.startsWith('offline-cache-'))
                    .map(key => caches.delete(key))));
        }
    </script>

    <script data-cfasync="false">
        window.playGifOnHover = (elementId, gifSrc, staticSrc) => {
            const imgElement = document.getElementById(elementId);
            if (imgElement) {
                imgElement.onmouseover = () => {
                    imgElement.width = 28;
                    imgElement.height = 28;
                    imgElement.src = gifSrc;
                };

                imgElement.onmouseout = () => {
                    imgElement.width = 25;
                    imgElement.height = 25;
                    imgElement.src = staticSrc;
                };
            }
        };

        window.downloadFile = (fileName, base64) => {
            const link = document.createElement('a');
            link.href = 'data:application/zip;base64,' + base64;
            link.download = fileName;
            link.click();
        };

        window.downloadTextFile = (fileName, mime, text) => {
            const blob = new Blob([text], { type: mime || 'text/plain' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        };
    </script>
</body>

<style>
    body {
        background-color: #999;
    }

    .lds-ring {
        /* change color here */
        color: #000;
    }

        .lds-ring,
        .lds-ring div {
            box-sizing: border-box;
        }

    .lds-ring {
        display: inline-block;
        position: relative;
        width: 80px;
        height: 80px;
    }

        .lds-ring div {
            box-sizing: border-box;
            display: block;
            position: absolute;
            width: 64px;
            height: 64px;
            margin: 8px;
            border: 8px solid currentColor;
            border-radius: 50%;
            animation: lds-ring 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
            border-color: currentColor transparent transparent transparent;
        }

            .lds-ring div:nth-child(1) {
                animation-delay: -0.45s;
            }

            .lds-ring div:nth-child(2) {
                animation-delay: -0.3s;
            }

            .lds-ring div:nth-child(3) {
                animation-delay: -0.15s;
            }

    @keyframes lds-ring {
        0% {
            transform: rotate(0deg);
        }

        100% {
            transform: rotate(360deg);
        }
    }
</style>
